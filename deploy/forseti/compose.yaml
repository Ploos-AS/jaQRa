# Template only. Install as /etc/ploos-apps/jaqra/compose.yaml after approval.
# JAQRA_IMAGE must be a GHCR image pinned to its immutable sha256 digest.
name: jaqra
services:
  app:
    image: ${JAQRA_IMAGE:?Set GHCR image pinned to sha256 digest}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${JAQRA_HOST_PORT:-18082}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 256m
    cpus: 0.35
    read_only: true
    tmpfs:
      - /tmp
      - /config
      - /data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - jaqra_private
networks:
  jaqra_private:
    driver: bridge
