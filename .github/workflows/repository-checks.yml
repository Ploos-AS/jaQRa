name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD || git diff --check
      - name: Verify initial project docs
        run: |
          test -s README.md
          test -s docs/ARCHITECTURE.md
          test -s CONTRIBUTING.md
