name: GHCR image release

on:
  pull_request:
    paths:
      - Dockerfile
      - Caddyfile
      - package.json
      - package-lock.json
      - src/**
      - public/**
      - scripts/**
      - .github/workflows/ghcr-release.yml
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Verify Docker build
        run: docker build --pull -t jaqra:ci .

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.repository == 'Ploos-AS/jaQRa'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive immutable tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/ploos-as/jaqra
          echo "sha=${IMAGE}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Tag must be a semver vX.Y.Z tag" >&2; exit 1; }
            echo "version=${IMAGE}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tags.outputs.sha }}
            ${{ steps.tags.outputs.version }}
          provenance: mode=max
          sbom: true
      - name: Publish digest to run summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### jaQRa GHCR image" >> "$GITHUB_STEP_SUMMARY"
          echo 'Use this immutable reference in Forseti Compose (after separate approval):' >> "$GITHUB_STEP_SUMMARY"
          echo "`ghcr.io/ploos-as/jaqra@${DIGEST}`" >> "$GITHUB_STEP_SUMMARY"
          echo 'No deployment or DNS changes were performed.' >> "$GITHUB_STEP_SUMMARY"
